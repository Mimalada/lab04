
name: GCP Deploy

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lab04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Lint
        id: lint-step
        run: npm run lint

      - name: check-lint
        if: failure() && steps.lint-step.outcome == 'failure'
        run: echo "Codigo precisa ser revisto!!"

  build_docker:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
